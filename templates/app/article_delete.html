{% extends "app/base.html" %} {% load i18n %} {% block content %}
<h1>{% trans "Delete Article" %}</h1>
<p>
  {% blocktrans with title=object.title %}Are you sure you want to delete
  <strong>{{ title }}</strong>?{% endblocktrans %}
</p>

<form method="post" style="margin-top: 20px">
  {% csrf_token %}
  <button
    type="submit"
    style="
      padding: 10px 20px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    "
  >
    {% trans "Confirm Delete" %}
  </button>
  <a
    href="{% url 'home' %}"
    style="
      padding: 10px 20px;
      background-color: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    "
  >
    {% trans "Cancel" %}
  </a>
</form>

<div style="margin-top: 20px">
  <a href="{% url 'home' %}" style="color: #007bff; text-decoration: none">
    ← {% trans "Back to Home" %}
  </a>
</div>
{% endblock %}
