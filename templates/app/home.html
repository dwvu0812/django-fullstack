{% extends "app/base.html" %} {% block content %}
<h1>Articles</h1>
{% if articles %}
<ul>
  {% for article in articles %}
  <li>
    {{ article.title }}
    <a href="{% url 'update_article' pk=article.id %}">&#128393;</a>
    <a href="{% url 'delete_article' pk=article.id %}">&#128473;</a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No articles found</p>
{% endif %}
<a href="{% url 'create_article' %}">Create Article</a>
{% endblock %}
