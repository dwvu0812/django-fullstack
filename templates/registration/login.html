{% extends "app/base.html" %} {% block content %}
<div
  style="
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #f9f9f9;
  "
>
  <h2 style="text-align: center; margin-bottom: 20px; color: #333">Login</h2>

  {% if form.errors %}
  <div
    style="
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    "
  >
    {{ form.errors }}
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 15px">
      <label
        for="{{ form.username.id_for_label }}"
        style="display: block; margin-bottom: 5px; font-weight: bold"
        >Username:</label
      >
      {{ form.username }}
    </div>
    <div style="margin-bottom: 20px">
      <label
        for="{{ form.password.id_for_label }}"
        style="display: block; margin-bottom: 5px; font-weight: bold"
        >Password:</label
      >
      {{ form.password }}
    </div>
    <button
      type="submit"
      style="
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      "
    >
      Login
    </button>
  </form>

  <div style="text-align: center; margin-top: 20px; color: #666">
    <p>Demo credentials:</p>
    <p><strong>Username:</strong> admin | <strong>Password:</strong> admin</p>
  </div>
</div>

<style>
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
  }
</style>
{% endblock %}
